<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estante de Notas 3D</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js (3D) e GSAP (Animações elásticas) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- Tela 3D -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Botão "+" no canto superior direito -->
  <button id="btn-add-note" title="Criar novo livro">+</button>

  <!-- MODAL DO BLOCO DE NOTAS -->
  <div id="modal-overlay" class="hidden">
    <div id="note-modal">
      <div class="modal-header">
        <input type="text" id="note-title" placeholder="Título do Livro..." maxlength="18" />
        <button id="modal-close" class="close-btn" title="Fechar">&times;</button>
      </div>

      <!-- Abas de Ferramentas -->
      <div class="tab-buttons">
        <button type="button" class="tab-btn active" data-tab="text">✍️ Texto</button>
        <button type="button" class="tab-btn" data-tab="list">☑️ Lista</button>
        <button type="button" class="tab-btn" data-tab="draw">🎨 Desenho</button>
      </div>

      <!-- 1. Aba de Texto -->
      <div id="tab-text" class="tab-content active">
        <textarea id="note-text" placeholder="Escreva suas anotações aqui..."></textarea>
      </div>

      <!-- 2. Aba de Lista de Tarefas -->
      <div id="tab-list" class="tab-content">
        <div class="checklist-input-group">
          <input type="text" id="list-input" placeholder="Novo item da lista..." />
          <button type="button" id="list-add-btn">+</button>
        </div>
        <ul id="checklist-items"></ul>
      </div>

      <!-- 3. Aba de Desenho à mão livre -->
      <div id="tab-draw" class="tab-content">
        <div class="draw-tools">
          <label for="draw-color">Cor:</label>
          <input type="color" id="draw-color" value="#3a2f28" />
          <button type="button" id="draw-clear" class="btn-secondary">Limpar Tela</button>
        </div>
        <canvas id="draw-canvas" width="420" height="230"></canvas>
      </div>

      <!-- Rodapé: Seletor de Cores da Capa e Botões -->
      <div class="modal-footer">
        <div class="color-picker-group">
          <span class="color-label">Capa:</span>
          <div class="color-palette">
            <span class="color-circle active" data-color="#d95d4f" style="background: #d95d4f;"></span>
            <span class="color-circle" data-color="#e9b657" style="background: #e9b657;"></span>
            <span class="color-circle" data-color="#7ca884" style="background: #7ca884;"></span>
            <span class="color-circle" data-color="#548c96" style="background: #548c96;"></span>
            <span class="color-circle" data-color="#e27a65" style="background: #e27a65;"></span>
            <span class="color-circle" data-color="#455a64" style="background: #455a64;"></span>
          </div>
        </div>

        <div class="action-buttons">
          <button type="button" id="btn-delete" class="btn-danger hidden">Excluir</button>
          <button type="button" id="btn-save" class="btn-primary">Salvar Livro</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
